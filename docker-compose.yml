services:
  db:
    image: postgres:16-alpine
    container_name: sazkara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sazkara
      POSTGRES_PASSWORD: sazkara
      POSTGRES_DB: sazkara
      # Postgres builds its collation from this; keeps ORDER BY sane for Persian text.
      LANG: C.UTF-8
    ports:
      - '5432:5432'
    volumes:
      - sazkara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sazkara -d sazkara']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sazkara-pgdata:
