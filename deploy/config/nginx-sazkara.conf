# Nginx site for Sazkara Maintenance.
# Install:  sudo cp nginx-sazkara.conf /etc/nginx/sites-available/sazkara
#           sudo ln -s /etc/nginx/sites-available/sazkara /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS:  sudo certbot --nginx -d YOUR_DOMAIN
# (certbot edits this file to add the certificate and the http -> https redirect.)

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Photos and signatures are uploaded through the app; the app itself caps them at 25 MB.
    client_max_body_size 30m;

    # PDF generation for a busy day can take a while.
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # $http_host keeps the port. The app rejects form submissions whose Origin does not
        # match the forwarded host, so $host (no port) would break sign-in whenever the
        # site is reached on a port or an IP:port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
